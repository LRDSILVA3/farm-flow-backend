version: '3.8'

services:
  api:
    build: .
    container_name: farmflow-backend
    ports:
      - '3333:3333'
    environment:
      - PORT=3333
      - NODE_ENV=production
      - APP_SECRET=farmflow-secret-key-2026
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=farmflow
      - RUN_SEED=true
      - TS_NODE_TRANSPILE_ONLY=true
    depends_on:
      - postgres
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: farmflow-postgres
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=farmflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
